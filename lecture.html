<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Lecture du rapport</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="glass-card">
      <h1 id="title"></h1>
      <p id="meta"></p>
      <div id="content"></div>

      <button class="btn secondary" onclick="history.back()">Retour</button>
    </div>
  </div>

  <div id="identModal" class="modal">
    <div class="glass-card">
      <h2>Identification</h2>

      <label>Qui lit ?</label>
      <input id="reader">

      <label>Clé admin (optionnel)</label>
      <input id="adminkey" type="password">

      <p id="err" style="color:red;"></p>

      <button class="btn secondary" onclick="location.href='index.html'">Quitter</button>
      <button class="btn primary" id="ok">Continuer</button>
    </div>
  </div>
  <div id="overlay" class="overlay"></div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore, doc, getDoc, collection, addDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const ADMIN_KEY = "AIT-ADMIN-2024";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const id = new URLSearchParams(location.search).get("id");

    let report = null;
    let reader = null;
    let isAdmin = false;

    document.getElementById("ok").onclick = () => {
      reader = document.getElementById("reader").value.trim();
      const key = document.getElementById("adminkey").value.trim();

      if (!reader) {
        document.getElementById("err").textContent = "Nom obligatoire";
        return;
      }

      if (key && key !== ADMIN_KEY) {
        document.getElementById("err").textContent = "Clé admin incorrecte";
        return;
      }

      isAdmin = key === ADMIN_KEY;

      document.getElementById("identModal").classList.add("hidden");
      document.getElementById("overlay").classList.add("hidden");

      render();
      log();
    };

    async function load() {
      const snap = await getDoc(doc(db, "reports", id));
      if (!snap.exists()) return;

      report = snap.data();
    }

    function render() {
      document.getElementById("title").textContent = report.title;
      document.getElementById("meta").textContent = "Jour : " + report.day + " — Par " + report.createdBy;
      document.getElementById("content").innerHTML = report.content;
    }

    async function log() {
      await addDoc(collection(db, "logs"), {
        reportId: id,
        reader,
        isAdmin,
        day: report.day,
        ts: serverTimestamp()
      });
    }

    load();
  </script>
</body>
</html>
