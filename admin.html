<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - Rapports AIT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="glass-card">
      <h1>Nouveau rapport</h1>

      <div class="editor-area" id="editor" contenteditable="true"></div>

      <button class="btn secondary" id="clear">Vider</button>
      <button class="btn primary" id="save">Terminer</button>
    </div>
  </div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const ADMIN_KEY = "AIT-ADMIN-2024";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("clear").onclick = () => {
      if (confirm("Vider ?")) document.getElementById("editor").innerHTML = "";
    };

    document.getElementById("save").onclick = async () => {
      const content = document.getElementById("editor").innerHTML.trim();
      if (!content) return alert("Vide");

      const day = prompt("Jour (YYYY-MM-DD)");
      if (!day) return;

      const title = prompt("Titre");
      if (!title) return;

      const createdBy = prompt("Nom admin") || "Admin";

      const key = prompt("Clé admin");
      if (key !== ADMIN_KEY) return alert("Clé incorrecte");

      await addDoc(collection(db, "reports"), {
        day,
        title,
        content,
        createdBy,
        adminKey: ADMIN_KEY,
        createdAt: serverTimestamp()
      });

      alert("Enregistré");
      document.getElementById("editor").innerHTML = "";
    };
  </script>
</body>
</html>
