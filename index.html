<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Choisir un jour - Rapports AIT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container glass-card" style="max-width:500px;margin-top:60px;">
  <h1>Rapports AIT</h1>
  <p>Choisis un jour pour voir les rapports.</p>

  <label for="dayInput">Jour :</label>
  <input type="date" id="dayInput">

  <button class="btn primary" id="goButton">Voir les rapports</button>
</div>

<script>
document.getElementById("goButton").onclick = () => {
  const day = document.getElementById("dayInput").value;
  if (!day) return alert("Choisis un jour !");
  window.location.href = "rapports.html?day=" + day;
};
</script>

</body>
</html>
