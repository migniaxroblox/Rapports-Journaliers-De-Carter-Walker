<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Rapports AIT - Choisir un jour</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="glass-card" style="max-width:500px;margin:60px auto;">
      <h1>Rapports AIT</h1>
      <p class="small">Serveur SCP RP — GitHub + Firebase</p>

      <label>Jour :</label>
      <input type="date" id="dayInput">

      <button class="btn primary" id="goButton">Voir les rapports</button>
    </div>
  </div>

  <script>
    document.getElementById("goButton").onclick = () => {
      const d = document.getElementById("dayInput").value;
      if (!d) return alert("Choisis un jour");
      location.href = "rapports.html?day=" + d;
    };
  </script>
</body>
</html>
