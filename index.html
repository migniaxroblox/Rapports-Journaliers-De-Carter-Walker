<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Rapports AIT - Choisir un jour</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="glass-card" style="max-width:500px;margin:60px auto;">
      <h1>Rapports AIT</h1>
      <p class="small" style="margin-top:4px;">Serveur SCP RP — GitHub + Firebase</p>

      <div style="margin-top:16px;">
        <label for="dayInput">Jour :</label>
        <input type="date" id="dayInput">
      </div>

      <button class="btn primary" id="goButton" style="margin-top:10px;">Voir les rapports</button>
    </div>
  </div>

  <script>
    const goButton = document.getElementById("goButton");
    const dayInput = document.getElementById("dayInput");

    goButton.addEventListener("click", () => {
      const day = dayInput.value;
      if (!day) {
        alert("Choisis un jour.");
        return;
      }
      window.location.href = "rapports.html?day=" + encodeURIComponent(day);
    });
  </script>
</body>
</html>
