<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Rapports du jour</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="glass-card">
      <h1>Rapports du jour</h1>
      <p id="dayLabel"></p>

      <div id="reportsList"></div>
      <p id="emptyMsg" class="small"></p>

      <button class="btn secondary" onclick="location.href='index.html'">Changer de jour</button>
      <button class="btn primary" onclick="location.href='admin.html'">Panel admin</button>
    </div>
  </div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore, collection, query, where, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const day = params.get("day");

    document.getElementById("dayLabel").textContent = "Jour : " + day;

    async function load() {
      const q = query(collection(db, "reports"), where("day", "==", day));
      const snap = await getDocs(q);

      if (snap.empty) {
        document.getElementById("emptyMsg").textContent = "Aucun rapport.";
        return;
      }

      const docs = [];
      snap.forEach(d => docs.push({ id: d.id, ...d.data() }));

      docs.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));

      const list = document.getElementById("reportsList");

      docs.forEach(r => {
        const div = document.createElement("div");
        div.className = "report-card";
        div.innerHTML = `
          <div>
            <div>${r.title}</div>
            <div class="small">Par ${r.createdBy}</div>
          </div>
          <button class="btn primary" onclick="location.href='lecture.html?id=${r.id}'">Lire</button>
        `;
        list.appendChild(div);
      });
    }

    load();
  </script>
</body>
</html>
