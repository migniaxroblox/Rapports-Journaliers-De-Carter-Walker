<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Rapports du jour</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Rapports du jour</h1>
      <p class="small" id="dayLabel"></p>
    </header>

    <main class="app-main">
      <section class="glass-card">
        <div id="reportsList"></div>
        <p id="emptyMsg" class="small" style="margin-top:8px;"></p>
        <div style="margin-top:16px;">
          <a href="index.html" class="btn secondary">Changer de jour</a>
          <a href="admin.html" class="btn primary" style="margin-left:8px;">Panel admin</a>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      query,
      where,
      orderBy,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const day = params.get("day");

    const dayLabel = document.getElementById("dayLabel");
    const reportsList = document.getElementById("reportsList");
    const emptyMsg = document.getElementById("emptyMsg");

    if (!day) {
      dayLabel.textContent = "Aucun jour sélectionné.";
    } else {
      dayLabel.textContent = "Jour : " + day;
    }

    async function loadReports() {
      if (!day) {
        emptyMsg.textContent = "Retourne à l'accueil pour choisir un jour.";
        return;
      }

      const q = query(
        collection(db, "reports"),
        where("day", "==", day),
        orderBy("createdAt", "desc")
      );

      const snap = await getDocs(q);

      if (snap.empty) {
        emptyMsg.textContent = "Aucun rapport pour ce jour.";
        return;
      }

      emptyMsg.textContent = "";
      snap.forEach(docSnap => {
        const data = docSnap.data();
        const div = document.createElement("div");
        div.className = "report-card";

        div.innerHTML = `
          <div>
            <div class="report-title">${data.title || "Sans titre"}</div>
            <div class="small">Par ${data.createdBy || "Inconnu"}</div>
          </div>
          <button class="btn primary" onclick="window.location.href='lecture.html?id=${docSnap.id}'">Lire</button>
        `;

        reportsList.appendChild(div);
      });
    }

    loadReports();
  </script>
</body>
</html>
