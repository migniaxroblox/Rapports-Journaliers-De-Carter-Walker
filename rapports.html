<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const day = params.get("day");

const dayLabel = document.getElementById("dayLabel");
const reportsList = document.getElementById("reportsList");
const emptyMsg = document.getElementById("emptyMsg");

dayLabel.textContent = "Jour : " + day;

async function loadReports() {
  const q = query(
    collection(db, "reports"),
    where("day", "==", day)
  );

  const snap = await getDocs(q);

  if (snap.empty) {
    emptyMsg.textContent = "Aucun rapport pour ce jour.";
    return;
  }

  emptyMsg.textContent = "";

  // Trier manuellement par createdAt
  const docs = [];
  snap.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));

  docs.sort((a, b) => {
    if (!a.createdAt || !b.createdAt) return 0;
    return b.createdAt.seconds - a.createdAt.seconds;
  });

  docs.forEach(data => {
    const div = document.createElement("div");
    div.className = "report-card";

    div.innerHTML = `
      <div>
        <div class="report-title">${data.title}</div>
        <div class="small">Par ${data.createdBy}</div>
      </div>
      <button class="btn primary" onclick="window.location.href='lecture.html?id=${data.id}'">Lire</button>
    `;

    reportsList.appendChild(div);
  });
}

loadReports();
</script>
