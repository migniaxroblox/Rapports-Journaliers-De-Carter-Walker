<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Rapports du jour</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container glass-card">
  <h1>Rapports du jour</h1>
  <p id="dayLabel"></p>

  <div id="reportsList"></div>

  <a href="index.html" class="btn secondary" style="margin-top:20px;">Retour</a>
</div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const day = params.get("day");

document.getElementById("dayLabel").textContent = "Jour : " + day;

async function loadReports() {
  const q = query(collection(db, "reports"), where("day", "==", day));
  const snap = await getDocs(q);

  const list = document.getElementById("reportsList");

  if (snap.empty) {
    list.innerHTML = "<p>Aucun rapport pour ce jour.</p>";
    return;
  }

  snap.forEach(doc => {
    const data = doc.data();
    const div = document.createElement("div");
    div.className = "glass-card";
    div.style.marginTop = "10px";

    div.innerHTML = `
      <h3>${data.title}</h3>
      <button class="btn primary" onclick="window.location.href='lecture.html?id=${doc.id}'">Lire</button>
    `;

    list.appendChild(div);
  });
}

loadReports();
</script>

</body>
</html>
